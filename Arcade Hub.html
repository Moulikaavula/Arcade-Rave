<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0fb;--pn:#fff;--ink:#14172e;--mut:#5d6385;--ac:#d97706;--tl:#0e9f95;--pk:#d6336c;--ln:#d5d9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--pn:#1c2040;--ink:#f1f2ff;--mut:#9aa0cc;--ac:#ffc233;--tl:#2fd1c5;--pk:#ff4f8b;--ln:#2e3466}}
:root[data-theme="dark"]{--bg:#12142b;--pn:#1c2040;--ink:#f1f2ff;--mut:#9aa0cc;--ac:#ffc233;--tl:#2fd1c5;--pk:#ff4f8b;--ln:#2e3466}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:880px;margin:0 auto;padding:28px 18px 48px}
h1{font:22px/1.4 "Press Start 2P",monospace;margin:0 0 8px;color:var(--ac)}
h2{font-size:18px;margin:32px 0 12px}
p.s{color:var(--mut);margin:0;max-width:60ch}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.t{background:var(--pn);border:2px solid var(--ln);border-radius:6px;padding:16px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.t:hover,.t:focus-visible{border-color:var(--tl);outline:none}
.t b{display:block;font-size:17px;margin-top:6px}.t span{color:var(--mut);font-size:14px}.t i{font-style:normal;font-size:30px}
#st{display:none;background:var(--pn);border:2px solid var(--tl);border-radius:6px;padding:16px;margin-top:20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h3{margin:0;flex:1;font-size:18px}
button.b{background:var(--ac);color:#12142b;border:0;border-radius:4px;padding:8px 14px;font:600 14px system-ui;cursor:pointer}
button.b.o{background:none;color:var(--ink);border:2px solid var(--ln)}
#hud{font-weight:700;color:var(--pk)}
#ar{display:flex;flex-direction:column;align-items:center;gap:10px;touch-action:none}
.cv{background:#12142b;border-radius:4px;max-width:100%;height:auto;border:2px solid var(--ln)}
.hint{color:var(--mut);font-size:14px;margin:10px 0 0;text-align:center}
.b3{display:grid;grid-template-columns:repeat(3,84px);gap:6px}
.b3 button{height:84px;font-size:40px;font-weight:700;background:var(--bg);color:var(--ink);border:2px solid var(--ln);border-radius:4px;cursor:pointer}
.b4m{display:grid;grid-template-columns:repeat(4,72px);gap:8px}
.card{height:72px;font-size:34px;background:var(--tl);border:0;border-radius:4px;cursor:pointer}
.card.up{background:var(--bg);border:2px solid var(--ln)}
.b4{display:grid;grid-template-columns:repeat(4,72px);gap:6px;background:var(--ln);padding:6px;border-radius:4px}
.b4 div{height:72px;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--bg);color:#12142b;border-radius:3px}
.wr{display:grid;grid-template-columns:repeat(5,48px);gap:5px}
.wr div{height:48px;display:grid;place-items:center;font-weight:800;font-size:22px;text-transform:uppercase;border:2px solid var(--ln);border-radius:3px}
.wr .g1{background:#2f9e5a;color:#fff;border-color:#2f9e5a}.wr .y1{background:#c99a14;color:#fff;border-color:#c99a14}.wr .x1{background:var(--ln)}
input{font:inherit;padding:8px;border:2px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--ink);width:120px;text-transform:uppercase}
.mn{display:grid;grid-template-columns:repeat(9,34px);gap:2px}
.mn button{height:34px;padding:0;font-weight:800;background:var(--tl);border:0;border-radius:2px;cursor:pointer;color:#12142b}
.mn button.op{background:var(--bg);color:var(--ink)}
.c4{display:grid;grid-template-columns:repeat(7,42px);gap:4px;background:var(--ln);padding:6px;border-radius:6px}
.c4 button{height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer}
:root:root:root{--bg:#07040f;--pn:#120a24;--ink:#f6f0ff;--mut:#b7a6e8;--ac:#ffe62b;--tl:#2bffea;--pk:#ff2bd6;--ln:#3a1d6e}
body{background:#07040f;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:-60%;z-index:-2;background:conic-gradient(from 0deg,#ff2bd6,#2bffea,#7a2bff,#ffe62b,#ff2bd6);opacity:.22;filter:blur(60px);animation:sp 18s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 120%,#7a2bff55,transparent 60%);pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes hu{to{filter:hue-rotate(360deg)}}
@keyframes bt{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(-6deg)}}
@keyframes mq{to{transform:translateX(-50%)}}
h1{font-size:clamp(24px,6vw,46px);line-height:1.3;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #ff2bd6,0 0 38px #ff2bd6,0 0 70px #7a2bff;animation:hu 6s linear infinite}
h2{font:14px "Press Start 2P",monospace;color:var(--tl);text-shadow:0 0 10px var(--tl);margin:36px 0 14px}
.mq{overflow:hidden;white-space:nowrap;margin:18px -18px;padding:10px 0;border-block:2px solid var(--pk);box-shadow:0 0 18px #ff2bd666,inset 0 0 18px #ff2bd633;font-size:30px}
.mq div{display:inline-block;animation:mq 22s linear infinite}
.t{border-color:hsl(var(--h,300) 100% 60%);box-shadow:0 0 14px hsl(var(--h,300) 100% 55%/.45),inset 0 0 20px hsl(var(--h,300) 100% 55%/.12);transition:transform .15s}
.t:hover,.t:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 0 28px hsl(var(--h,300) 100% 60%),inset 0 0 26px hsl(var(--h,300) 100% 55%/.3);border-color:#fff}
.t i{display:inline-block;font-size:42px;filter:drop-shadow(0 0 10px hsl(var(--h,300) 100% 60%));animation:bt .94s ease-in-out infinite;animation-delay:calc(var(--h,0)*-9ms)}
.t b{text-shadow:0 0 8px hsl(var(--h,300) 100% 60%)}
#st{box-shadow:0 0 30px #2bffea88,inset 0 0 30px #2bffea22}
button.b{background:linear-gradient(90deg,#ff2bd6,#ffe62b);box-shadow:0 0 14px #ff2bd6aa}
#hud{text-shadow:0 0 10px var(--pk)}
.cv{border-color:var(--tl);box-shadow:0 0 20px #2bffea88}
.ch{display:grid;grid-template-columns:repeat(8,38px);border:2px solid var(--pk);box-shadow:0 0 20px #ff2bd699}
.ch button{height:38px;padding:0;border:0;font-size:26px;cursor:pointer;text-shadow:0 0 3px #000}
.ch .lt{background:#3b2c7a}.ch .dk{background:#1a1040}
.ch .ck{box-shadow:inset 0 0 0 3px #ff3b3b,inset 0 0 16px #ff3b3b}
.ch .lg{box-shadow:inset 0 0 0 3px var(--tl)}.ch .sl{box-shadow:inset 0 0 0 3px var(--ac)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-3;animation:hu 24s linear infinite}
body::before{opacity:.1}
select{font:inherit;padding:8px;border:2px solid var(--pk);border-radius:4px;background:var(--bg);color:var(--ink);box-shadow:0 0 12px #ff2bd666}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

p.s{font-size:17px;margin-top:8px}
.t{position:relative;border-radius:16px;padding:20px 18px;overflow:hidden;background:linear-gradient(150deg,rgba(24,12,48,.88),rgba(14,8,30,.72));backdrop-filter:blur(6px)}
.t::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}
.t:hover::after{transform:translateX(120%)}
.t b{font:11px/1.6 "Press Start 2P",monospace;margin-top:12px}
.bd{position:absolute;top:10px;right:10px;font:normal 12px system-ui;color:var(--ac);background:#000a;padding:2px 8px;border-radius:99px}.bd:empty{display:none}
#st{border-radius:18px;padding:20px;backdrop-filter:blur(8px);animation:pi .35s ease-out}
@keyframes pi{from{opacity:0;transform:translateY(14px) scale(.97)}}
button.b{border-radius:999px;padding:9px 18px;transition:transform .12s}button.b:hover{transform:scale(1.06)}button.b:active{transform:scale(.95)}
button.b.o{background:#ffffff0f}
.b3 button,.card{transition:transform .1s}.b3 button:active,.card:active{transform:scale(.92)}.card.up{animation:pi .25s}
#ar{position:relative}
.ov{position:absolute;inset:-6px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,4,15,.84);backdrop-filter:blur(5px);border-radius:14px;animation:pi .3s;text-align:center;padding:12px}
.ov h4{font:16px/1.5 "Press Start 2P",monospace;margin:0;color:var(--ac);text-shadow:0 0 14px var(--ac)}.ov p{margin:0;color:var(--ink)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.ft{margin-top:44px;text-align:center;color:var(--mut);font-size:13px}
</style></head>
<body><canvas id="bg" aria-hidden="true"></canvas><div class="w">
<h1>Arcade rave</h1>
<p class="s">Eleven games, three difficulty levels, real animals. Pick one and turn it up.</p><button class="b o" id="mu" aria-pressed="false" style="margin-top:12px">🔊 Sound on</button>
<div class="mq" id="mq" aria-hidden="true"></div>

<h2>Classics</h2>
<div class="g" id="c1"></div>
<h2>Popular right now</h2>
<div class="g" id="c2"></div>

<section id="st" aria-live="polite">
<div class="bar"><button class="b o" id="bk">Back</button><h3 id="gt"></h3><span id="hud"></span><span id="bs" style="color:var(--tl);font-weight:700"></span><select id="df" aria-label="Difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option></select><button class="b" id="rs">Restart</button></div>
<div id="ar"></div><p class="hint" id="hn"></p>
</section>
<p class="ft">Best scores are saved on this device · Esc goes back</p>
</div>
<script>
const $=s=>document.querySelector(s),mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const cv=(el,w,h)=>{const c=mk('canvas','cv');c.width=w;c.height=h;el.append(c);return c};
const swipe=(el,f)=>{let s;el.addEventListener('touchstart',e=>{s=e.touches[0]},{passive:true});el.addEventListener('touchend',e=>{if(!s)return;const t=e.changedTouches[0],dx=t.clientX-s.clientX,dy=t.clientY-s.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?f(dx>0?1:-1,0):f(0,dy>0?1:-1)})};

/* Snake */
function snake(el,hud){const c=cv(el,300,300),x=c.getContext('2d');let s=[[7,7],[6,7]],d=[1,0],nd=d,f=[11,7],sc=0,dead=0;
const turn=(a,b)=>{if(a+d[0]||b+d[1])nd=[a,b]};
const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}};
addEventListener('keydown',key);swipe(c,turn);hud('Score 0');
const draw=()=>{x.fillStyle='#12142b';x.fillRect(0,0,300,300);x.fillStyle='#1a1f40';for(let i=0;i<15;i++)for(let j=0;j<15;j++)if((i+j)%2)x.fillRect(i*20,j*20,20,20);
const C=p=>[p[0]*20+10,p[1]*20+10];
{const[mx,my]=C(f);x.fillStyle='#b8bcd6';x.beginPath();x.ellipse(mx,my+1,7,5.5,0,0,7);x.fill();x.fillStyle='#ffb3c8';[[-4,-5],[3,-5]].forEach(([a,b])=>{x.beginPath();x.arc(mx+a,my+b,2.6,0,7);x.fill()});x.beginPath();x.arc(mx+7,my+1,1.6,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(mx+3,my-1,1,0,7);x.fill();x.strokeStyle='#ffb3c8';x.lineWidth=1.5;x.beginPath();x.moveTo(mx-7,my+2);x.quadraticCurveTo(mx-11,my+8,mx-5,my+9);x.stroke()}
x.lineCap=x.lineJoin='round';
for(const[w,col]of[[17,'#1e8f4a'],[11,'#2fd16a'],[4,'#b6f5c9']]){x.strokeStyle=col;x.lineWidth=w;x.beginPath();s.forEach((p,i)=>{const[a,b]=C(p);i&&Math.abs(p[0]-s[i-1][0])+Math.abs(p[1]-s[i-1][1])<2?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
s.forEach((p,i)=>{if(i&&i%2){const[a,b]=C(p);x.fillStyle='#157a3a';x.beginPath();x.arc(a,b,3,0,7);x.fill()}});
{const[hx,hy]=C(s[0]),[dx,dy]=d,px=-dy,py=dx,t=(sc+Date.now()/150|0)%2,tx=hx+dx*(t?19:15),ty=hy+dy*(t?19:15);
x.strokeStyle='#ff2b5e';x.lineWidth=2;x.beginPath();x.moveTo(hx+dx*10,hy+dy*10);x.lineTo(tx,ty);x.moveTo(tx,ty);x.lineTo(tx+dx*4+px*3,ty+dy*4+py*3);x.moveTo(tx,ty);x.lineTo(tx+dx*4-px*3,ty+dy*4-py*3);x.stroke();
x.fillStyle='#2fd16a';x.strokeStyle='#1e8f4a';x.lineWidth=2;x.beginPath();x.ellipse(hx,hy,11,9,Math.atan2(dy,dx),0,7);x.fill();x.stroke();
[1,-1].forEach(k=>{const ex=hx+dx*3+px*5*k,ey=hy+dy*3+py*5*k;x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,3.2,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(ex+dx,ey+dy,1.6,0,7);x.fill()})}};
let iv;const tick=()=>{if(dead)return;d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];if(DF==0){h[0]=(h[0]+15)%15;h[1]=(h[1]+15)%15}
if(h[0]<0||h[1]<0||h[0]>14||h[1]>14||s.some(p=>p[0]==h[0]&&p[1]==h[1])){dead=1;hud('Game over: '+sc);return}
s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;hud('Score '+sc);do f=[Math.random()*15|0,Math.random()*15|0];while(s.some(p=>p[0]==f[0]&&p[1]==f[1]))}else s.pop();
draw();iv=setTimeout(tick,Math.max([90,60,40][DF],[150,115,80][DF]-sc*3))};draw();iv=setTimeout(tick,[150,115,80][DF]);
return()=>{dead=1;clearTimeout(iv);removeEventListener('keydown',key)}}

/* Tic-tac-toe */
function ttt(el,hud){let b=Array(9).fill(''),over=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const[a,c,d]of L)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return b[a];return b.includes('')?null:'t'};
const mm=(b,p)=>{const w=win(b);if(w)return w=='O'?1:w=='X'?-1:0;let best=p=='O'?-2:2;b.forEach((v,i)=>{if(!v){b[i]=p;const s=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,s):Math.min(best,s)}});return best};
const w=mk('div','b3'),bs=[];el.append(w);hud('You are 🐱');
const end=()=>{const r=win(b);if(r){over=1;hud(r=='t'?'Draw':r=='X'?'You win!':'Computer wins')}return r};
const ai=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);let m;if(Math.random()<[.5,.2,0][DF])m=e[Math.random()*e.length|0];else{let bs=-9;e.forEach(i=>{b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;m=i}})}b[m]='O'};
for(let i=0;i<9;i++){const k=mk('button');k.onclick=()=>{if(over||b[i])return;b[i]='X';if(!end()){ai();end()}bs.forEach((q,j)=>q.textContent=b[j]=='X'?'🐱':b[j]=='O'?'🐶':'')};bs.push(k);w.append(k)}
return()=>{}}

/* Memory */
function mem(el,hud){const e=[...'🐶🐱🐼🦊🐸🐵🦁🐯'].slice(0,[4,6,8][DF]);let d=[...e,...e].sort(()=>Math.random()-.5),o=[],m=0,mv=0,lock=0;const w=mk('div','b4m');hud('0 moves');
d.forEach(s=>{const b=mk('button','card');b.setAttribute('aria-label','card');b.onclick=()=>{if(lock||b.classList.contains('up'))return;b.classList.add('up');b.textContent=s;o.push([b,s]);
if(o.length==2){mv++;hud(mv+' moves');if(o[0][1]==s){m++;o=[];if(m==e.length)hud('Done in '+mv+' moves!')}else{lock=1;setTimeout(()=>{o.forEach(([k])=>{k.classList.remove('up');k.textContent=''});o=[];lock=0},[1100,700,450][DF])}}};w.append(b)});el.append(w);return()=>{}}

/* 2048 */
function g2048(el,hud){let b=Array(16).fill(0),sc=0;const w=mk('div','b4');el.append(w);
const add=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<[1,.9,.7][DF]?2:4};
const line=a=>{let r=a.filter(v=>v);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;sc+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r};
const stuck=()=>!b.includes(0)&&!b.some((v,i)=>(i%4<3&&v==b[i+1])||(i<12&&v==b[i+4]));
const draw=()=>{w.innerHTML='';b.forEach(v=>{const c=mk('div');if(v){c.innerHTML=(['🐭','🐹','🐰','🦊','🐱','🐶','🐼','🦁','🐯','🐉','🦄'][Math.log2(v)-1]||'👑')+'<br>'+v;c.style.cssText+='font-size:15px;line-height:1.15;text-align:center;';c.style.background=`hsl(${(Math.log2(v)*38+20)%360} 75% 60%)`;if(v>999)c.style.fontSize='13px'}w.append(c)});hud(stuck()?'No moves. Score '+sc:'Score '+sc)};
const mv=(dx,dy)=>{if(stuck())return;const o=b.join();for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>dx?(dx>0?k*4+3-j:k*4+j):(dy>0?(3-j)*4+k:j*4+k));const r=line(idx.map(i=>b[i]));idx.forEach((i,j)=>b[i]=r[j])}if(b.join()!=o)add();draw()};
const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();mv(...m)}};
addEventListener('keydown',key);swipe(w,mv);add();add();draw();return()=>removeEventListener('keydown',key)}

/* Word guess */
const WORDS='apple brave crane dance eagle flame ghost house input joker knife lemon magic night ocean piano queen robot snake tiger vivid water youth zebra pixel candy glide sword pilot storm cloud bread chair dream earth fruit grape light music plant river smile train'.split(' ');
function word(el,hud){const N=[8,6,5][DF],t=WORDS[Math.random()*WORDS.length|0];let row=0,done=0;const w=mk('div','wr'),R=[];
for(let i=0;i<N;i++){const r=[];for(let j=0;j<5;j++){const c=mk('div');w.append(c);r.push(c)}R.push(r)}
const i=mk('input');i.maxLength=5;i.placeholder='5 letters';i.setAttribute('aria-label','Your guess');const go=mk('button','b');go.textContent='Guess';
const bar=mk('div','bar');bar.append(i,go);el.append(w,bar);hud('Guess 1 of '+N);
const sub=()=>{if(done)return;const v=i.value.toLowerCase();if(!/^[a-z]{5}$/.test(v)){hud('Type exactly 5 letters');return}
const res=Array(5).fill('x1'),left=t.split('');[...v].forEach((ch,k)=>{if(ch==t[k]){res[k]='g1';left[k]=null}});
[...v].forEach((ch,k)=>{if(res[k]=='x1'){const q=left.indexOf(ch);if(q>=0){res[k]='y1';left[q]=null}}});
R[row].forEach((c,k)=>{c.textContent=v[k];c.className=res[k]});row++;i.value='';
if(v==t){done=1;hud('You got it!')}else if(row==N){done=1;hud('The word was '+t)}else hud('Guess '+(row+1)+' of '+N)};
go.onclick=sub;i.onkeydown=e=>{if(e.key=='Enter')sub()};return()=>{}}

/* Flap */
function flap(el,hud){const G=[65,50,38][DF],SP=[2,2.4,3][DF];const c=cv(el,320,420),x=c.getContext('2d');let y=200,v=0,p=[],t=0,sc=0,dead=0,on=0;hud('Score 0');
const jump=e=>{if(e&&e.preventDefault)e.preventDefault();if(dead)return;on=1;v=-6.2;beep(520,.05)};
const key=e=>{if(e.code=='Space'||e.key=='ArrowUp')jump(e)};addEventListener('keydown',key);c.addEventListener('pointerdown',jump);

{const c=$('#bg'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,t=0,tx=.5,ty=.5,mx=.5,my=.5,P=[],R=[];

x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();const sg=x.createLinearGradient(0,cy-r,0,cy+r);sg.addColorStop(0,'#ffe62b');sg.addColorStop(1,'#ff2bd6');x.fillStyle=sg;x.fillRect(cx-r,cy-r,r*2,r*2);
x.fillStyle=sk;for(let i=0;i<7;i++)x.fillRect(cx-r,cy+r*.05+i*r*.15,r*2,i*1.3+1.5);x.restore();

x.strokeStyle='#2bffea';x.shadowColor='#2bffea';x.beginPath();x.moveTo(0,hz);x.lineTo(W,hz);x.stroke();x.shadowBlur=0;

P.forEach(p=>{p.l-=.02;p.x+=p.vx;p.y+=p.vy});P=P.filter(p=>p.l>0);P.forEach(p=>{x.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;x.beginPath();x.arc(p.x,p.y,p.l*5+.5,0,7);x.fill()});
R.forEach(q=>{q.r+=9;q.a-=.015});R=R.filter(q=>q.a>0);R.forEach(q=>{x.strokeStyle=`rgba(255,43,214,${q.a})`;x.lineWidth=3;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.stroke()});
x.globalCompositeOperation='source-over';requestAnimationFrame(f)}};f();addEventListener('resize',()=>{if(rm)f()})}
