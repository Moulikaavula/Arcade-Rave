<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0fb;--pn:#fff;--ink:#14172e;--mut:#5d6385;--ac:#d97706;--tl:#0e9f95;--pk:#d6336c;--ln:#d5d9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--pn:#1c2040;--ink:#f1f2ff;--mut:#9aa0cc;--ac:#ffc233;--tl:#2fd1c5;--pk:#ff4f8b;--ln:#2e3466}}
:root[data-theme="dark"]{--bg:#12142b;--pn:#1c2040;--ink:#f1f2ff;--mut:#9aa0cc;--ac:#ffc233;--tl:#2fd1c5;--pk:#ff4f8b;--ln:#2e3466}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:880px;margin:0 auto;padding:28px 18px 48px}
h1{font:22px/1.4 "Press Start 2P",monospace;margin:0 0 8px;color:var(--ac)}
h2{font-size:18px;margin:32px 0 12px}
p.s{color:var(--mut);margin:0;max-width:60ch}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.t{background:var(--pn);border:2px solid var(--ln);border-radius:6px;padding:16px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.t:hover,.t:focus-visible{border-color:var(--tl);outline:none}
.t b{display:block;font-size:17px;margin-top:6px}.t span{color:var(--mut);font-size:14px}.t i{font-style:normal;font-size:30px}
#st{display:none;background:var(--pn);border:2px solid var(--tl);border-radius:6px;padding:16px;margin-top:20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h3{margin:0;flex:1;font-size:18px}
button.b{background:var(--ac);color:#12142b;border:0;border-radius:4px;padding:8px 14px;font:600 14px system-ui;cursor:pointer}
button.b.o{background:none;color:var(--ink);border:2px solid var(--ln)}
#hud{font-weight:700;color:var(--pk)}
#ar{display:flex;flex-direction:column;align-items:center;gap:10px;touch-action:none}
.cv{background:#12142b;border-radius:4px;max-width:100%;height:auto;border:2px solid var(--ln)}
.hint{color:var(--mut);font-size:14px;margin:10px 0 0;text-align:center}
.b3{display:grid;grid-template-columns:repeat(3,84px);gap:6px}
.b3 button{height:84px;font-size:40px;font-weight:700;background:var(--bg);color:var(--ink);border:2px solid var(--ln);border-radius:4px;cursor:pointer}
.b4m{display:grid;grid-template-columns:repeat(4,72px);gap:8px}
.card{height:72px;font-size:34px;background:var(--tl);border:0;border-radius:4px;cursor:pointer}
.card.up{background:var(--bg);border:2px solid var(--ln)}
.b4{display:grid;grid-template-columns:repeat(4,72px);gap:6px;background:var(--ln);padding:6px;border-radius:4px}
.b4 div{height:72px;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--bg);color:#12142b;border-radius:3px}
.wr{display:grid;grid-template-columns:repeat(5,48px);gap:5px}
.wr div{height:48px;display:grid;place-items:center;font-weight:800;font-size:22px;text-transform:uppercase;border:2px solid var(--ln);border-radius:3px}
.wr .g1{background:#2f9e5a;color:#fff;border-color:#2f9e5a}.wr .y1{background:#c99a14;color:#fff;border-color:#c99a14}.wr .x1{background:var(--ln)}
input{font:inherit;padding:8px;border:2px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--ink);width:120px;text-transform:uppercase}
.mn{display:grid;grid-template-columns:repeat(9,34px);gap:2px}
.mn button{height:34px;padding:0;font-weight:800;background:var(--tl);border:0;border-radius:2px;cursor:pointer;color:#12142b}
.mn button.op{background:var(--bg);color:var(--ink)}
.c4{display:grid;grid-template-columns:repeat(7,42px);gap:4px;background:var(--ln);padding:6px;border-radius:6px}
.c4 button{height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer}
:root:root:root{--bg:#07040f;--pn:#120a24;--ink:#f6f0ff;--mut:#b7a6e8;--ac:#ffe62b;--tl:#2bffea;--pk:#ff2bd6;--ln:#3a1d6e}
body{background:#07040f;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:-60%;z-index:-2;background:conic-gradient(from 0deg,#ff2bd6,#2bffea,#7a2bff,#ffe62b,#ff2bd6);opacity:.22;filter:blur(60px);animation:sp 18s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 120%,#7a2bff55,transparent 60%);pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes hu{to{filter:hue-rotate(360deg)}}
@keyframes bt{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(-6deg)}}
@keyframes mq{to{transform:translateX(-50%)}}
h1{font-size:clamp(24px,6vw,46px);line-height:1.3;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #ff2bd6,0 0 38px #ff2bd6,0 0 70px #7a2bff;animation:hu 6s linear infinite}
h2{font:14px "Press Start 2P",monospace;color:var(--tl);text-shadow:0 0 10px var(--tl);margin:36px 0 14px}
.mq{overflow:hidden;white-space:nowrap;margin:18px -18px;padding:10px 0;border-block:2px solid var(--pk);box-shadow:0 0 18px #ff2bd666,inset 0 0 18px #ff2bd633;font-size:30px}
.mq div{display:inline-block;animation:mq 22s linear infinite}
.t{border-color:hsl(var(--h,300) 100% 60%);box-shadow:0 0 14px hsl(var(--h,300) 100% 55%/.45),inset 0 0 20px hsl(var(--h,300) 100% 55%/.12);transition:transform .15s}
.t:hover,.t:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 0 28px hsl(var(--h,300) 100% 60%),inset 0 0 26px hsl(var(--h,300) 100% 55%/.3);border-color:#fff}
.t i{display:inline-block;font-size:42px;filter:drop-shadow(0 0 10px hsl(var(--h,300) 100% 60%));animation:bt .94s ease-in-out infinite;animation-delay:calc(var(--h,0)*-9ms)}
.t b{text-shadow:0 0 8px hsl(var(--h,300) 100% 60%)}
#st{box-shadow:0 0 30px #2bffea88,inset 0 0 30px #2bffea22}
button.b{background:linear-gradient(90deg,#ff2bd6,#ffe62b);box-shadow:0 0 14px #ff2bd6aa}
#hud{text-shadow:0 0 10px var(--pk)}
.cv{border-color:var(--tl);box-shadow:0 0 20px #2bffea88}
.ch{display:grid;grid-template-columns:repeat(8,38px);border:2px solid var(--pk);box-shadow:0 0 20px #ff2bd699}
.ch button{height:38px;padding:0;border:0;font-size:26px;cursor:pointer;text-shadow:0 0 3px #000}
.ch .lt{background:#3b2c7a}.ch .dk{background:#1a1040}
.ch .ck{box-shadow:inset 0 0 0 3px #ff3b3b,inset 0 0 16px #ff3b3b}
.ch .lg{box-shadow:inset 0 0 0 3px var(--tl)}.ch .sl{box-shadow:inset 0 0 0 3px var(--ac)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-3;animation:hu 24s linear infinite}
body::before{opacity:.1}
select{font:inherit;padding:8px;border:2px solid var(--pk);border-radius:4px;background:var(--bg);color:var(--ink);box-shadow:0 0 12px #ff2bd666}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style></head>
<body><canvas id="bg" aria-hidden="true"></canvas><div class="w">
<h1>Arcade rave</h1>
<p class="s">Eleven games, zero downloads. Pick one and turn it up.</p>
<div class="mq" id="mq" aria-hidden="true"></div>

<h2>Classics</h2>
<div class="g" id="c1"></div>
<h2>Popular right now</h2>
<div class="g" id="c2"></div>

<section id="st" aria-live="polite">
<div class="bar"><button class="b o" id="bk">Back</button><h3 id="gt"></h3><span id="hud"></span><button class="b" id="rs">Restart</button></div>
<div id="ar"></div><p class="hint" id="hn"></p>
</section>
</div>
<script>
const $=s=>document.querySelector(s),mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const cv=(el,w,h)=>{const c=mk('canvas','cv');c.width=w;c.height=h;el.append(c);return c};
const swipe=(el,f)=>{let s;el.addEventListener('touchstart',e=>{s=e.touches[0]},{passive:true});el.addEventListener('touchend',e=>{if(!s)return;const t=e.changedTouches[0],dx=t.clientX-s.clientX,dy=t.clientY-s.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?f(dx>0?1:-1,0):f(0,dy>0?1:-1)})};

/* Snake */
function snake(el,hud){const c=cv(el,300,300),x=c.getContext('2d');let s=[[7,7],[6,7]],d=[1,0],nd=d,f=[11,7],sc=0,dead=0;
const turn=(a,b)=>{if(a+d[0]||b+d[1])nd=[a,b]};
const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}};
addEventListener('keydown',key);swipe(c,turn);hud('Score 0');
const iv=setInterval(()=>{if(dead)return;d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];
if(h[0]<0||h[1]<0||h[0]>14||h[1]>14||s.some(p=>p[0]==h[0]&&p[1]==h[1])){dead=1;hud('Game over: '+sc);return}
s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;hud('Score '+sc);f=[Math.random()*15|0,Math.random()*15|0]}else s.pop();
x.fillStyle='#12142b';x.fillRect(0,0,300,300);x.fillStyle='#ff4f8b';x.fillRect(f[0]*20+3,f[1]*20+3,14,14);
x.fillStyle='#2fd1c5';s.forEach(p=>x.fillRect(p[0]*20+1,p[1]*20+1,18,18))},110);
return()=>{clearInterval(iv);removeEventListener('keydown',key)}}

/* Tic-tac-toe */
function ttt(el,hud){let b=Array(9).fill(''),over=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const[a,c,d]of L)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return b[a];return b.includes('')?null:'t'};
const mm=(b,p)=>{const w=win(b);if(w)return w=='O'?1:w=='X'?-1:0;let best=p=='O'?-2:2;b.forEach((v,i)=>{if(!v){b[i]=p;const s=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,s):Math.min(best,s)}});return best};
const w=mk('div','b3'),bs=[];el.append(w);hud('You are X');
const end=()=>{const r=win(b);if(r){over=1;hud(r=='t'?'Draw':r=='X'?'You win!':'Computer wins')}return r};
const ai=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);let m;if(Math.random()<.2)m=e[Math.random()*e.length|0];else{let bs=-9;e.forEach(i=>{b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;m=i}})}b[m]='O'};
for(let i=0;i<9;i++){const k=mk('button');k.onclick=()=>{if(over||b[i])return;b[i]='X';if(!end()){ai();end()}bs.forEach((q,j)=>q.textContent=b[j])};bs.push(k);w.append(k)}
return()=>{}}

/* Memory */
function mem(el,hud){const e=[...'🍒🍋🍇🍉🥝🍓'];let d=[...e,...e].sort(()=>Math.random()-.5),o=[],m=0,mv=0,lock=0;const w=mk('div','b4m');hud('0 moves');
d.forEach(s=>{const b=mk('button','card');b.setAttribute('aria-label','card');b.onclick=()=>{if(lock||b.classList.contains('up'))return;b.classList.add('up');b.textContent=s;o.push([b,s]);
if(o.length==2){mv++;hud(mv+' moves');if(o[0][1]==s){m++;o=[];if(m==6)hud('Done in '+mv+' moves!')}else{lock=1;setTimeout(()=>{o.forEach(([k])=>{k.classList.remove('up');k.textContent=''});o=[];lock=0},700)}}};w.append(b)});el.append(w);return()=>{}}

/* 2048 */
function g2048(el,hud){let b=Array(16).fill(0),sc=0;const w=mk('div','b4');el.append(w);
const add=()=>{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};
const line=a=>{let r=a.filter(v=>v);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;sc+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r};
const stuck=()=>!b.includes(0)&&!b.some((v,i)=>(i%4<3&&v==b[i+1])||(i<12&&v==b[i+4]));
const draw=()=>{w.innerHTML='';b.forEach(v=>{const c=mk('div');if(v){c.textContent=v;c.style.background=`hsl(${(Math.log2(v)*38+20)%360} 75% 60%)`;if(v>999)c.style.fontSize='17px'}w.append(c)});hud(stuck()?'No moves. Score '+sc:'Score '+sc)};
const mv=(dx,dy)=>{if(stuck())return;const o=b.join();for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>dx?(dx>0?k*4+3-j:k*4+j):(dy>0?(3-j)*4+k:j*4+k));const r=line(idx.map(i=>b[i]));idx.forEach((i,j)=>b[i]=r[j])}if(b.join()!=o)add();draw()};
const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();mv(...m)}};
addEventListener('keydown',key);swipe(w,mv);add();add();draw();return()=>removeEventListener('keydown',key)}

/* Word guess */
const WORDS='apple brave crane dance eagle flame ghost house input joker knife lemon magic night ocean piano queen robot snake tiger vivid water youth zebra pixel candy glide sword pilot storm cloud bread chair dream earth fruit grape light music plant river smile train'.split(' ');
function word(el,hud){const t=WORDS[Math.random()*WORDS.length|0];let row=0,done=0;const w=mk('div','wr'),R=[];
for(let i=0;i<6;i++){const r=[];for(let j=0;j<5;j++){const c=mk('div');w.append(c);r.push(c)}R.push(r)}
const i=mk('input');i.maxLength=5;i.placeholder='5 letters';i.setAttribute('aria-label','Your guess');const go=mk('button','b');go.textContent='Guess';
const bar=mk('div','bar');bar.append(i,go);el.append(w,bar);hud('Guess 1 of 6');
const sub=()=>{if(done)return;const v=i.value.toLowerCase();if(!/^[a-z]{5}$/.test(v)){hud('Type exactly 5 letters');return}
const res=Array(5).fill('x1'),left=t.split('');[...v].forEach((ch,k)=>{if(ch==t[k]){res[k]='g1';left[k]=null}});
[...v].forEach((ch,k)=>{if(res[k]=='x1'){const q=left.indexOf(ch);if(q>=0){res[k]='y1';left[q]=null}}});
R[row].forEach((c,k)=>{c.textContent=v[k];c.className=res[k]});row++;i.value='';
if(v==t){done=1;hud('You got it!')}else if(row==6){done=1;hud('The word was '+t)}else hud('Guess '+(row+1)+' of 6')};
go.onclick=sub;i.onkeydown=e=>{if(e.key=='Enter')sub()};return()=>{}}

/* Flap */
function flap(el,hud){const c=cv(el,320,420),x=c.getContext('2d');let y=200,v=0,p=[],t=0,sc=0,dead=0,on=0;hud('Score 0');
const jump=e=>{if(e&&e.preventDefault)e.preventDefault();if(dead)return;on=1;v=-6.2};
const key=e=>{if(e.code=='Space'||e.key=='ArrowUp')jump(e)};addEventListener('keydown',key);c.addEventListener('pointerdown',jump);
const iv=setInterval(()=>{if(on&&!dead){v+=.38;y+=v;t++;if(t%90==1)p.push({x:330,g:110+Math.random()*190});p.forEach(o=>{o.x-=2.4;if(!o.s&&o.x+44<80){o.s=1;sc++;hud('Score '+sc)}if(80+11>o.x&&80-11<o.x+44&&(y-11<o.g-50||y+11>o.g+50))dead=1});if(p[0]&&p[0].x<-50)p.shift();if(y>420||y<0)dead=1;if(dead)hud('Game over: '+sc)}
x.fillStyle='#12142b';x.fillRect(0,0,320,420);x.fillStyle='#2fd1c5';p.forEach(o=>{x.fillRect(o.x,0,44,o.g-50);x.fillRect(o.x,o.g+50,44,420)});
x.fillStyle='#ffc233';x.beginPath();x.arc(80,y,11,0,7);x.fill();if(!on){x.fillStyle='#f1f2ff';x.font='16px system-ui';x.fillText('Tap or press space to start',70,300)}},16);
return()=>{clearInterval(iv);removeEventListener('keydown',key)}}

/* Pong */
function pong(el,hud){const c=cv(el,320,240),x=c.getContext('2d');let py=100,ay=100,bx=160,by=120,vx=3,vy=2,ps=0,as=0;hud('You 0 - 0 CPU');
const mv=e=>{const r=c.getBoundingClientRect(),cy=e.touches?e.touches[0].clientY:e.clientY;py=(cy-r.top)*240/r.height-25};
c.addEventListener('mousemove',mv);c.addEventListener('touchmove',e=>{e.preventDefault();mv(e)},{passive:false});
const key=e=>{if(e.key=='ArrowUp'){e.preventDefault();py-=22}if(e.key=='ArrowDown'){e.preventDefault();py+=22}};addEventListener('keydown',key);
const iv=setInterval(()=>{py=Math.max(0,Math.min(190,py));bx+=vx;by+=vy;if(by<0||by>240)vy=-vy;ay+=Math.max(-2.4,Math.min(2.4,by-25-ay));
if(vx<0&&bx<16&&bx>4&&by>py&&by<py+50){vx=-vx*1.05;vy+=(by-py-25)/8}
if(vx>0&&bx>304&&by>ay&&by<ay+50)vx=-vx;
if(bx<0||bx>320){const l=bx<0;l?as++:ps++;bx=160;by=120;vx=l?3:-3;vy=2;hud('You '+ps+' - '+as+' CPU')}
x.fillStyle='#12142b';x.fillRect(0,0,320,240);x.fillStyle='#2fd1c5';x.fillRect(6,py,8,50);x.fillStyle='#ff4f8b';x.fillRect(306,ay,8,50);x.fillStyle='#ffc233';x.fillRect(bx-4,by-4,8,8)},16);
return()=>{clearInterval(iv);removeEventListener('keydown',key)}}

/* Minesweeper */
function mine(el,hud){let m=Array(81).fill(0),r=Array(81).fill(0),f=Array(81).fill(0),first=1,over=0,flag=0;
const nb=i=>{const a=[],x=i%9,y=i/9|0;for(let dx=-1;dx<2;dx++)for(let dy=-1;dy<2;dy++){const u=x+dx,v=y+dy;if((dx||dy)&&u>=0&&u<9&&v>=0&&v<9)a.push(v*9+u)}return a};
const cnt=i=>nb(i).filter(k=>m[k]).length;
const open=i=>{if(r[i]||f[i])return;r[i]=1;if(!m[i]&&!cnt(i))nb(i).forEach(open)};
const tg=mk('button','b o');tg.textContent='Flag mode: off';tg.onclick=()=>{flag=!flag;tg.textContent='Flag mode: '+(flag?'on':'off')};
const w=mk('div','mn');el.append(tg,w);hud('10 mines');
const draw=()=>{w.innerHTML='';for(let i=0;i<81;i++){const b=mk('button');if(r[i]){b.className='op';b.textContent=m[i]?'💣':(cnt(i)||'')}else if(f[i])b.textContent='🚩';
b.onclick=()=>click(i);b.oncontextmenu=e=>{e.preventDefault();if(!over&&!r[i]){f[i]=!f[i];draw()}};w.append(b)}};
const click=i=>{if(over||r[i])return;if(flag){f[i]=!f[i];draw();return}if(f[i])return;
if(first){first=0;const ban=[i,...nb(i)];let n=0;while(n<10){const k=Math.random()*81|0;if(!m[k]&&!ban.includes(k)){m[k]=1;n++}}}
if(m[i]){over=1;m.forEach((v,k)=>{if(v)r[k]=1});hud('Boom! Game over')}else{open(i);if(r.filter(Boolean).length==71){over=1;hud('Cleared!')}}draw()};
draw();return()=>{}}

/* Connect four */
function c4(el,hud){const g=Array(42).fill(0);let over=0;const w=mk('div','c4');el.append(w);hud('You are red');
const drop=(c,p)=>{for(let r=5;r>=0;r--)if(!g[r*7+c]){g[r*7+c]=p;return r*7+c}return -1};
const wins=(i,p)=>{const x=i%7,y=i/7|0;return[[1,0],[0,1],[1,1],[1,-1]].some(([a,b])=>{let n=1;for(const s of[1,-1]){let u=x+a*s,v=y+b*s;while(u>=0&&u<7&&v>=0&&v<6&&g[v*7+u]==p){n++;u+=a*s;v+=b*s}}return n>=4})};
const ai=()=>{const cs=[0,1,2,3,4,5,6].filter(c=>!g[c]);for(const p of[2,1])for(const c of cs){const i=drop(c,p),k=wins(i,p);g[i]=0;if(k)return drop(c,2)}
const c=cs.sort(()=>Math.random()-.5).sort((a,b)=>Math.abs(a-3)-Math.abs(b-3))[0];return drop(c,2)};
const draw=()=>{w.innerHTML='';g.forEach((v,i)=>{const b=mk('button');b.setAttribute('aria-label','column '+(i%7+1));if(v)b.style.background=v==1?'#ff4f8b':'#ffc233';b.onclick=()=>play(i%7);w.append(b)})};
const play=c=>{if(over||g[c])return;const i=drop(c,1);if(wins(i,1)){over=1;hud('You win!')}else if(!g.includes(0)){over=1;hud('Draw')}else{const j=ai();if(wins(j,2)){over=1;hud('Computer wins')}}draw()};
draw();return()=>{}}

/* Whack-a-mole */
function mole(el,hud){let sc=0,t=30,a=-1;const w=mk('div','b3'),bs=[];
for(let i=0;i<9;i++){const b=mk('button');b.onclick=()=>{if(i==a&&t>0){sc++;a=-1;draw()}};bs.push(b);w.append(b)}
el.append(w);const draw=()=>{bs.forEach((b,i)=>b.textContent=i==a?'🐹':'');hud('Score '+sc+', '+t+'s left')};draw();
const iv=setInterval(()=>{a=Math.random()*9|0;draw()},650),tm=setInterval(()=>{t--;if(t<=0){clearInterval(iv);clearInterval(tm);a=-1;bs.forEach(b=>b.textContent='');hud('Time! Score '+sc);return}draw()},1000);
return()=>{clearInterval(iv);clearInterval(tm)}}

/* Chess: full rules. m: 0 beginner, 1 casual, 2 club, 4 expert, 5 impossible, 3 two players */
const CC={m:1};
function chess(el,hud){const U={k:'♚\uFE0E',q:'♛\uFE0E',r:'♜\uFE0E',b:'♝\uFE0E',n:'♞\uFE0E',p:'♟\uFE0E'},VAL={p:100,n:320,b:330,r:500,q:900,k:0},N8=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
let B=[...('rnbqkbnrpppppppp'+' '.repeat(32)+'PPPPPPPPRNBQKBNR')],S={c:'KQkq',e:-1,h:0},sel=-1,over=0,wt=true,busy=0,dead=0,hist={},dl=0;
const w=mk('div','ch'),sl=mk('select');sl.setAttribute('aria-label','Game mode');
[['Beginner',0],['Casual player',1],['Club player',2],['Expert',4],['Impossible',5],['2 players',3]].forEach(([o,k])=>{const e=mk('option');e.value=k;e.textContent=o;sl.append(e)});sl.value=CC.m;sl.onchange=()=>{CC.m=+sl.value;launch(cur)};
el.append(sl,w);
/* is square sq attacked by side wh? */
const att=(B,sq,wh)=>{const x=sq&7,y=sq>>3,py=y+(wh?1:-1);
for(const dx of[-1,1]){const u=x+dx;if(u>=0&&u<8&&py>=0&&py<8&&B[py*8+u]==(wh?'P':'p'))return 1}
for(const[a,b]of N8){const u=x+a,v=y+b;if(u>=0&&u<8&&v>=0&&v<8&&B[v*8+u]==(wh?'N':'n'))return 1}
for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){if(!a&&!b)continue;let u=x+a,v=y+b;if(u>=0&&u<8&&v>=0&&v<8&&B[v*8+u]==(wh?'K':'k'))return 1;
while(u>=0&&u<8&&v>=0&&v<8){const c=B[v*8+u];if(c!=' '){const t=c.toLowerCase();if((c<'a')==wh&&(t=='q'||(a&&b?t=='b':t=='r')))return 1;break}u+=a;v+=b}}return 0};
/* pseudo-legal moves of piece at i: [to, flag] flag: 0 normal, d double push, e en passant, c castle */
const pm=(B,i,S)=>{const p=B[i],wh=p<'a',t=p.toLowerCase(),x=i&7,y=i>>3,o=[];
const add=(u,v,cap,f)=>{if(u<0||u>7||v<0||v>7)return 0;const c=B[v*8+u];if(c!=' '&&(c<'a')==wh)return 0;if(cap==1&&c==' ')return 0;if(cap==2&&c!=' ')return 0;o.push([v*8+u,f||0]);return c==' '};
if(t=='p'){const d=wh?-1:1;if(add(x,y+d,2)&&y==(wh?6:1))add(x,y+2*d,2,'d');
for(const dx of[-1,1]){const u=x+dx;if(u<0||u>7)continue;add(u,y+d,1);if((y+d)*8+u==S.e)o.push([S.e,'e'])}}
else if(t=='n')N8.forEach(([a,b])=>add(x+a,y+b));
else if(t=='k'){for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)(a||b)&&add(x+a,y+b);
const k=wh?60:4,R=wh?'R':'r';if(i==k&&!att(B,k,!wh)){
if(S.c.includes(wh?'K':'k')&&B[k+1]==' '&&B[k+2]==' '&&B[k+3]==R&&!att(B,k+1,!wh)&&!att(B,k+2,!wh))o.push([k+2,'c']);
if(S.c.includes(wh?'Q':'q')&&B[k-1]==' '&&B[k-2]==' '&&B[k-3]==' '&&B[k-4]==R&&!att(B,k-1,!wh)&&!att(B,k-2,!wh))o.push([k-2,'c'])}}
else{const D=[];if(t!='b')D.push([1,0],[-1,0],[0,1],[0,-1]);if(t!='r')D.push([1,1],[1,-1],[-1,1],[-1,-1]);D.forEach(([a,b])=>{for(let k=1;k<8&&add(x+a*k,y+b*k);k++);})}
return o};
/* apply move, returns [board, state] */
const ap=(B,S,a,b,f)=>{const N=[...B],c=N[a],wh=c<'a',t=c.toLowerCase();let cr=S.c,e=-1;const h=(t=='p'||N[b]!=' ')?0:S.h+1;
if(f=='e')N[b+(wh?8:-8)]=' ';
if(f=='c'){const r=b>a?a+3:a-4,rt=b>a?a+1:a-1;N[rt]=N[r];N[r]=' '}
N[b]=c;N[a]=' ';
if(t=='p'){if(f=='d')e=(a+b)/2;if(b<8||b>55)N[b]=wh?'Q':'q'}
if(t=='k')cr=cr.replace(wh?/[KQ]/g:/[kq]/g,'');
const rm={0:'q',7:'k',56:'Q',63:'K'};for(const s of[a,b])if(rm[s])cr=cr.replace(rm[s],'');
return[N,{c:cr,e,h}]};
/* all legal moves for side wh: [from,to,flag] */
const lm=(B,S,wh)=>{const o=[];for(let i=0;i<64;i++){const c=B[i];if(c==' '||(c<'a')!=wh)continue;for(const[to,f]of pm(B,i,S)){const[N]=ap(B,S,i,to,f);if(!att(N,N.indexOf(wh?'K':'k'),!wh))o.push([i,to,f])}}return o};
const imat=B=>{const o=B.filter(c=>c!=' '&&c.toLowerCase()!='k');return !o.length||(o.length==1&&'nb'.includes(o[0].toLowerCase()))};
const ev=B=>{let s=0;for(let i=0;i<64;i++){const c=B[i];if(c==' ')continue;const t=c.toLowerCase(),wh=c<'a',x=i&7,y=i>>3,ce=14-Math.abs(2*x-7)-Math.abs(2*y-7);
const v=VAL[t]+(t=='n'||t=='b'?ce*4:t=='p'?(wh?6-y:y-1)*8+ce*2:t=='q'?ce:t=='k'?-ce*2:0);s+=wh?-v:v}return s};
const order=(B,M)=>M.map(m=>[m[0],m[1],m[2],B[m[1]]==' '?0:VAL[B[m[1]].toLowerCase()]-VAL[B[m[0]].toLowerCase()]/10]).sort((p,q)=>q[3]-p[3]);
const qs=(B,S,al,be,blk,n)=>{const e=(blk?1:-1)*ev(B);if(n==0||e>=be)return e;if(e>al)al=e;
for(const[a,b,f]of order(B,lm(B,S,!blk))){if(B[b]==' '&&f!='e')continue;const[N,T]=ap(B,S,a,b,f),s=-qs(N,T,-be,-al,!blk,n-1);if(s>=be)return s;if(s>al)al=s;if(Date.now()>dl)break}return al};
const sr=(B,S,d,al,be,blk)=>{const M=lm(B,S,!blk);if(!M.length)return att(B,B.indexOf(blk?'k':'K'),!blk)?-30000-d:0;
if(S.h>=100||imat(B))return 0;if(d==0)return qs(B,S,al,be,blk,4);let best=-1e9;
for(const[a,b,f]of order(B,M)){const[N,T]=ap(B,S,a,b,f),s=-sr(N,T,d-1,-be,-al,!blk);if(s>best)best=s;if(best>al)al=best;if(al>=be||Date.now()>dl)break}return best};
const think=(M,maxD,ms,nz)=>{dl=Date.now()+ms;M=order(B,M);let bm=M[0];
for(let d=1;d<=maxD;d++){let al=-1e9,cb=null;for(const m of M){const[N,T]=ap(B,S,m[0],m[1],m[2]),s=-sr(N,T,d-1,-1e9,-al,false)+Math.random()*(nz||3);if(!cb||s>al){al=s;cb=m}if(Date.now()>dl)break}
if(Date.now()>dl&&d>1)break;bm=cb;M.sort((p,q)=>p==bm?-1:q==bm?1:0)}return bm};
/* a capture is free if it can't be recaptured, or wins material even if it is */
const free=M=>{let best=null;M.forEach(([a,b,f])=>{if(B[b]==' '&&f!='e')return;const v=B[b]==' '?100:VAL[B[b].toLowerCase()],at=VAL[B[a].toLowerCase()],[N,T]=ap(B,S,a,b,f),safe=!lm(N,T,true).some(m=>m[1]==b),g=safe?v:v-at;
if((safe||v>at+50)&&(!best||g>best[3]))best=[a,b,f,g]});return best};
const play=m=>{[B,S]=ap(B,S,m[0],m[1],m[2]);wt=!wt};
const key=()=>B.join('')+wt+S.c+S.e;
const chk=()=>att(B,B.indexOf(wt?'K':'k'),!wt);
const st=()=>hud((chk()?'Check! ':'')+(CC.m==3?(wt?'White':'Black')+"'s turn":wt?'Your move':'Thinking...'));
const ai=()=>{const L=CC.m,M=lm(B,S,false);if(!M.length)return;let bm;
if(L<2){const f=free(M);if(f&&Math.random()<(L?1:.85))bm=f}
if(!bm&&L==0&&Math.random()<.3)bm=M[Math.random()*M.length|0];
if(!bm)bm=think(M,{0:2,1:2,2:3,4:5,5:9}[L],{0:300,1:400,2:1200,4:2500,5:4000}[L],{0:300,1:70,2:25,4:8,5:0}[L]);
play(bm)};
const fin=()=>{const k=key(),T=CC.m==3;hist[k]=(hist[k]||0)+1;
if(!lm(B,S,wt).length){over=1;hud(chk()?'Checkmate! '+(T?(wt?'Black':'White')+' wins':wt?'Computer wins':'You win!'):'Stalemate: draw');return 1}
if(imat(B)){over=1;hud('Draw: not enough pieces to mate');return 1}
if(S.h>=100){over=1;hud('Draw: 50-move rule');return 1}
if(hist[k]>=3){over=1;hud('Draw: threefold repetition');return 1}return 0};
const draw=()=>{w.innerHTML='';const L=sel>=0?lm(B,S,wt).filter(m=>m[0]==sel).map(m=>m[1]):[],kg=chk()?B.indexOf(wt?'K':'k'):-1;
(CC.m==3&&!wt?[...Array(64).keys()].reverse():[...Array(64).keys()]).forEach(i=>{const c=B[i],b=mk('button');b.className=((i%8+(i>>3))%2?'dk':'lt')+(i==sel?' sl':'')+(L.includes(i)?' lg':'')+(i==kg?' ck':'');
b.textContent=U[c.toLowerCase()]||'';b.style.color=c<'a'?'#fff':'#ff8bf0';b.setAttribute('aria-label','square');b.onclick=()=>click(i);w.append(b)})};
const click=i=>{if(over||busy)return;const m=sel>=0&&lm(B,S,wt).find(m=>m[0]==sel&&m[1]==i);
if(m){sel=-1;play(m);if(!fin()){if(CC.m==3)st();else{busy=1;st();draw();setTimeout(()=>{if(dead)return;ai();busy=0;if(!fin())st();draw()},40);return}}}
else sel=B[i]!=' '&&(B[i]<'a')==wt?i:-1;draw()};
hist[key()]=1;st();draw();return()=>{dead=1}}

{const s=GAMES.map(g=>g.i).join('  ')+'  ';$('#mq').innerHTML='<div>'+s.repeat(8)+'</div>'}

/* Synthwave background */
{const c=$('#bg'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,t=0,tx=.5,ty=.5,mx=.5,my=.5,P=[],R=[];
const S=Array.from({length:110},()=>[Math.random(),Math.random()*.55,Math.random()*2+.6]);

const sk=x.createLinearGradient(0,0,0,hz);sk.addColorStop(0,'#07040f');sk.addColorStop(1,'#3a0f6e');x.fillStyle=sk;x.fillRect(0,0,W,hz+1);

x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();const sg=x.createLinearGradient(0,cy-r,0,cy+r);sg.addColorStop(0,'#ffe62b');sg.addColorStop(1,'#ff2bd6');x.fillStyle=sg;x.fillRect(cx-r,cy-r,r*2,r*2);
x.fillStyle=sk;for(let i=0;i<7;i++)x.fillRect(cx-r,cy+r*.05+i*r*.15,r*2,i*1.3+1.5);x.restore();
x.fillStyle='#14072e';x.beginPath();x.moveTo(0,hz);for(let i=0;i<=W;i+=16)x.lineTo(i,hz-(Math.abs(Math.sin(i*.011+1))*70+Math.sin(i*.037)*16)*(Math.abs(i-cx)/W*1.6+.15));x.lineTo(W,hz);x.fill();
const gg=x.createLinearGradient(0,hz,0,H);gg.addColorStop(0,'#2a0a55');gg.addColorStop(1,'#07040f');x.fillStyle=gg;x.fillRect(0,hz,W,H-hz);

if(!rm){x.globalCompositeOperation='lighter';const px=mx*W,py=my*H,gl=x.createRadialGradient(px,py,0,px,py,170);gl.addColorStop(0,'rgba(43,255,234,.35)');gl.addColorStop(1,'rgba(43,255,234,0)');x.fillStyle=gl;x.fillRect(0,0,W,H);
P.forEach(p=>{p.l-=.02;p.x+=p.vx;p.y+=p.vy});P=P.filter(p=>p.l>0);P.forEach(p=>{x.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;x.beginPath();x.arc(p.x,p.y,p.l*5+.5,0,7);x.fill()});
R.forEach(q=>{q.r+=9;q.a-=.015});R=R.filter(q=>q.a>0);R.forEach(q=>{x.strokeStyle=`rgba(255,43,214,${q.a})`;x.lineWidth=3;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.stroke()});
x.globalCompositeOperation='source-over';requestAnimationFrame(f)}};f();addEventListener('resize',()=>{if(rm)f()})}
